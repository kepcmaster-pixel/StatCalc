<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>StatCalc · with graphs</title>
  <!-- Chart.js CDN for lightweight charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 20, 30, 0.15), 0 8px 16px rgba(0, 0, 0, 0.05);
      padding: 2rem 2rem 2.2rem;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #0b2a3b;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.1rem;
      flex-wrap: wrap;
    }

    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #2c5a73;
      margin-left: 0.5rem;
      opacity: 0.8;
    }

    .subhead {
      color: #1f4a5e;
      margin-bottom: 1.5rem;
      border-left: 3px solid #3b8ba0;
      padding-left: 0.9rem;
      font-weight: 400;
      font-size: 0.95rem;
    }

    .input-area {
      background: white;
      padding: 1.5rem 1.5rem 1.2rem;
      border-radius: 1.8rem;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02), 0 6px 12px rgba(0, 20, 30, 0.06);
      margin-bottom: 1.8rem;
      border: 1px solid rgba(200, 215, 225, 0.5);
    }

    label {
      font-weight: 500;
      color: #144153;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    label i {
      font-style: normal;
      background: #d7e6ef;
      padding: 0 0.5rem;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #003153;
    }

    textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      border: 1px solid #cbdee9;
      border-radius: 1.4rem;
      background: #fafdff;
      resize: vertical;
      min-height: 100px;
      transition: 0.2s;
      line-height: 1.6;
      color: #0c2b3b;
    }

    textarea:focus {
      outline: 2px solid #3b8ba0;
      outline-offset: 2px;
      border-color: transparent;
      background: #ffffff;
      box-shadow: 0 4px 8px rgba(0, 60, 80, 0.04);
    }

    .input-hint {
      display: flex;
      justify-content: flex-end;
      font-size: 0.8rem;
      color: #3f6f84;
      margin: 0.3rem 0.2rem 0;
      opacity: 0.8;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin: 1.2rem 0 1.8rem;
      align-items: center;
      justify-content: center;
    }

    .btn {
      border: none;
      background: white;
      padding: 0.7rem 2rem;
      border-radius: 3rem;
      font-weight: 500;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 4px 8px rgba(0, 20, 30, 0.04);
      border: 1px solid rgba(180, 200, 215, 0.3);
      flex: 1 1 auto;
      min-width: 120px;
      background: #f0f7fb;
      color: #0e384b;
    }

    .btn-primary {
      background: #1b5a72;
      border: 1px solid #1b5a72;
      color: white;
      box-shadow: 0 6px 12px rgba(20, 80, 100, 0.15);
    }

    .btn-primary:hover {
      background: #134b60;
      transform: scale(0.98);
      box-shadow: 0 4px 8px rgba(20, 70, 90, 0.2);
    }

    .btn-secondary {
      background: #e3edf3;
      border: 1px solid #c3d7e2;
    }

    .btn-secondary:hover {
      background: #d3e2eb;
      transform: scale(0.98);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .error-msg {
      background: #ffecf0;
      color: #b3364a;
      padding: 0.7rem 1.4rem;
      border-radius: 3rem;
      font-size: 0.9rem;
      margin: 0.2rem 0 1rem;
      border-left: 4px solid #c73b4e;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      word-break: break-word;
    }

    .error-msg:empty {
      display: none;
    }

    /* stats + charts layout */
    .results-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
      margin-top: 0.8rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.7rem;
      align-content: start;
    }

    .stat-item {
      background: white;
      padding: 0.5rem 0.4rem 0.5rem 1rem;
      border-radius: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(190, 215, 230, 0.3);
      backdrop-filter: blur(2px);
      background: rgba(255, 255, 255, 0.75);
      font-size: 0.85rem;
    }

    .stat-label {
      font-weight: 450;
      color: #1b4d62;
      text-transform: uppercase;
      font-size: 0.65rem;
      opacity: 0.7;
      letter-spacing: 0.02em;
    }

    .stat-value {
      font-weight: 600;
      color: #093141;
      background: #e7f0f7;
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      font-size: 0.9rem;
      min-width: 45px;
      text-align: right;
      font-feature-settings: "tnum";
    }

    .stat-value.empty {
      opacity: 0.5;
      font-weight: 400;
    }

    .chart-section {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .chart-box {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(2px);
      border-radius: 1.8rem;
      padding: 0.8rem 0.6rem 0.4rem;
      border: 1px solid rgba(190, 215, 230, 0.25);
      box-shadow: 0 6px 12px rgba(0, 20, 30, 0.03);
    }

    .chart-box canvas {
      max-width: 100%;
      height: auto !important;
      max-height: 140px;
      width: 100% !important;
    }

    .chart-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #1f5268;
      opacity: 0.7;
      margin-left: 0.5rem;
      margin-bottom: 0.2rem;
    }

    .footer-meta {
      margin-top: 1.8rem;
      color: #326277;
      font-size: 0.75rem;
      text-align: center;
      border-top: 1px solid rgba(140, 180, 200, 0.2);
      padding-top: 1rem;
      opacity: 0.7;
    }

    @media (max-width: 780px) {
      .results-panel {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .chart-box canvas {
        max-height: 160px;
      }
    }

    @media (max-width: 550px) {
      .card { padding: 1.5rem; }
      h1 { font-size: 1.8rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
      .stat-item { padding: 0.4rem 0.3rem 0.4rem 0.7rem; font-size: 0.75rem; }
      .btn { min-width: 100px; padding: 0.6rem 1rem; }
    }

    @media (max-width: 400px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="card" role="main">
  <h1>
    📊 StatCalc
    <small>· with graphs</small>
  </h1>
  <div class="subhead">Enter numbers separated by commas, spaces, or new lines</div>

  <div class="input-area">
    <label for="numberInput">
      <span>📋 Input</span>
      <i>comma · space · newline</i>
    </label>
    <textarea id="numberInput" placeholder="e.g. 12, 45, 78, 23  56&#10;89, 34  12.5, 9">12, 45, 78, 23, 56, 89, 34, 12.5, 9</textarea>
    <div class="input-hint">paste or type your numbers</div>
  </div>

  <div class="action-bar">
    <button class="btn btn-primary" id="calculateBtn">🔢 Calculate</button>
    <button class="btn btn-secondary" id="clearBtn">✕ Clear</button>
  </div>

  <div id="errorDisplay" class="error-msg" aria-live="polite"></div>

  <div class="results-panel" id="resultsPanel">
    <!-- stats grid -->
    <div class="stats-grid" id="statsGrid"></div>
    <!-- charts -->
    <div class="chart-section">
      <div class="chart-box">
        <div class="chart-title">📊 Bar chart (values)</div>
        <canvas id="barChart" width="300" height="150"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title">📈 Histogram (distribution)</div>
        <canvas id="histogramChart" width="300" height="150"></canvas>
      </div>
    </div>
  </div>
  <div class="footer-meta">count · sum · mean · median · mode · min · max · range · variance (sample/pop) · std dev (sample/pop)</div>
</div>

<script>
  (function() {
    'use strict';

    // DOM refs
    const textarea = document.getElementById('numberInput');
    const calculateBtn = document.getElementById('calculateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const errorDisplay = document.getElementById('errorDisplay');
    const statsGrid = document.getElementById('statsGrid');

    // chart instances
    let barChartInstance = null;
    let histogramInstance = null;

    // ---------- helpers ----------
    function parseNumberList(inputString) {
      const raw = inputString.trim();
      if (raw === '') return [];
      const tokens = raw.split(/[\s,]+/).filter(s => s !== '');
      return tokens.map(s => parseFloat(s)).filter(v => !isNaN(v));
    }

    // ---------- statistics ----------
    function computeStats(arr) {
      if (!arr || arr.length === 0) return null;
      const sorted = [...arr].sort((a, b) => a - b);
      const n = arr.length;
      const sum = arr.reduce((acc, v) => acc + v, 0);
      const mean = sum / n;
      const min = sorted[0];
      const max = sorted[n-1];
      const range = max - min;

      let median;
      const mid = Math.floor(n / 2);
      if (n % 2 === 0) median = (sorted[mid-1] + sorted[mid]) / 2;
      else median = sorted[mid];

      // mode
      const freqMap = new Map();
      let maxFreq = 0;
      let modes = [];
      for (const val of arr) {
        const count = (freqMap.get(val) || 0) + 1;
        freqMap.set(val, count);
        if (count > maxFreq) { maxFreq = count; modes = [val]; }
        else if (count === maxFreq) modes.push(val);
      }
      const mode = (maxFreq === 1) ? null : modes[0];

      const popVariance = arr.reduce((acc, v) => acc + (v - mean) ** 2, 0) / n;
      const popStd = Math.sqrt(popVariance);
      let sampleVariance, sampleStd;
      if (n > 1) {
        sampleVariance = arr.reduce((acc, v) => acc + (v - mean) ** 2, 0) / (n - 1);
        sampleStd = Math.sqrt(sampleVariance);
      } else {
        sampleVariance = NaN;
        sampleStd = NaN;
      }

      return {
        count: n, sum, mean, median, mode, min, max, range,
        variancePop: popVariance, varianceSample: sampleVariance,
        stdPop: popStd, stdSample: sampleStd,
        data: arr, sorted
      };
    }

    // ---------- render stats ----------
    function renderStats(stats) {
      if (!stats) {
        statsGrid.innerHTML = `<div class="stat-item"><span class="stat-label">no data</span><span class="stat-value empty">—</span></div>`;
        return;
      }
      const fmt = (val, digits = 4) => {
        if (val === undefined || val === null || !isFinite(val)) return '—';
        if (typeof val === 'number' && Number.isInteger(val)) return val.toString();
        if (typeof val === 'number') return val.toFixed(digits);
        return val.toString();
      };
      const modeDisplay = (stats.mode !== null && stats.mode !== undefined) ? fmt(stats.mode, 4) : '—';
      const vPop = isNaN(stats.variancePop) ? '—' : fmt(stats.variancePop, 4);
      const vSample = isNaN(stats.varianceSample) ? '—' : fmt(stats.varianceSample, 4);
      const sPop = isNaN(stats.stdPop) ? '—' : fmt(stats.stdPop, 4);
      const sSample = isNaN(stats.stdsample) ? '—' : fmt(stats.stdsample, 4);

      const items = [
        { label: 'Count', value: stats.count },
        { label: 'Sum', value: fmt(stats.sum, 2) },
        { label: 'Mean', value: fmt(stats.mean, 4) },
        { label: 'Median', value: fmt(stats.median, 4) },
        { label: 'Mode', value: modeDisplay },
        { label: 'Min', value: fmt(stats.min, 2) },
        { label: 'Max', value: fmt(stats.max, 2) },
        { label: 'Range', value: fmt(stats.range, 2) },
        { label: 'Var (pop)', value: vPop },
        { label: 'Var (sample)', value: vSample },
        { label: 'Std (pop)', value: sPop },
        { label: 'Std (sample)', value: sSample },
      ];

      statsGrid.innerHTML = items.map(item => `
        <div class="stat-item">
          <span class="stat-label">${item.label}</span>
          <span class="stat-value">${item.value}</span>
        </div>
      `).join('');
    }

    // ---------- charts ----------
    function renderCharts(dataArray) {
      // destroy old charts if exist
      if (barChartInstance) { barChartInstance.destroy(); barChartInstance = null; }
      if (histogramInstance) { histogramInstance.destroy(); histogramInstance = null; }

      if (!dataArray || dataArray.length === 0) {
        // show empty chart with no data
        const ctxBar = document.getElementById('barChart').getContext('2d');
        const ctxHist = document.getElementById('histogramChart').getContext('2d');
        barChartInstance = new Chart(ctxBar, { type: 'bar', data: { labels: ['no data'], datasets: [{ data: [0] }] }, options: { responsive: true, maintainAspectRatio: true } });
        histogramInstance = new Chart(ctxHist, { type: 'bar', data: { labels: ['no data'], datasets: [{ data: [0] }] }, options: { responsive: true, maintainAspectRatio: true } });
        return;
      }

      // ---- Bar chart: show each value (up to 30 points for readability) ----
      const barLabels = dataArray.map((_, i) => `#${i+1}`);
      const barData = dataArray.slice(0, 30); // limit to 30 for clarity
      const ctxBar = document.getElementById('barChart').getContext('2d');
      barChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: barLabels,
          datasets: [{
            label: 'Values',
            data: barData,
            backgroundColor: 'rgba(44, 130, 160, 0.6)',
            borderColor: 'rgba(28, 85, 110, 0.9)',
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.04)' } } }
        }
      });

      // ---- Histogram: binning (Freedman–Diaconis rule / simple auto) ----
      const values = dataArray;
      const n = values.length;
      const min = Math.min(...values);
      const max = Math.max(...values);
      let binCount = Math.min(Math.round(Math.sqrt(n)), 15);
      if (binCount < 2) binCount = 2;
      if (max === min) {
        // all same value -> single bin
        const ctxHist = document.getElementById('histogramChart').getContext('2d');
        histogramInstance = new Chart(ctxHist, {
          type: 'bar',
          data: {
            labels: [min.toFixed(2)],
            datasets: [{ label: 'Frequency', data: [n], backgroundColor: 'rgba(60, 140, 170, 0.6)', borderColor: '#1f5a72', borderWidth: 1 }]
          },
          options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }
        });
        return;
      }

      const binWidth = (max - min) / binCount;
      const bins = new Array(binCount).fill(0);
      const binLabels = [];
      for (let i = 0; i < binCount; i++) {
        const lower = min + i * binWidth;
        const upper = (i === binCount - 1) ? max : min + (i+1) * binWidth;
        binLabels.push(`${lower.toFixed(1)}–${upper.toFixed(1)}`);
      }
      for (const v of values) {
        let idx = Math.min(Math.floor((v - min) / binWidth), binCount - 1);
        if (v === max) idx = binCount - 1;
        bins[idx]++;
      }

      const ctxHist = document.getElementById('histogramChart').getContext('2d');
      histogramInstance = new Chart(ctxHist, {
        type: 'bar',
        data: {
          labels: binLabels,
          datasets: [{
            label: 'Frequency',
            data: bins,
            backgroundColor: 'rgba(50, 130, 160, 0.55)',
            borderColor: '#1d5d78',
            borderWidth: 1,
            borderRadius: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.04)' } } }
        }
      });
    }

    // ---------- core process ----------
    function processInput() {
      const rawInput = textarea.value;
      const numbers = parseNumberList(rawInput);

      if (numbers.length === 0) {
        errorDisplay.textContent = '⚠️ No valid numbers found. Please enter numbers separated by commas, spaces, or new lines.';
        statsGrid.innerHTML = `<div class="stat-item"><span class="stat-label">no data</span><span class="stat-value empty">—</span></div>`;
        renderCharts([]);
        return;
      }

      errorDisplay.textContent = '';
      const stats = computeStats(numbers);
      renderStats(stats);
      renderCharts(stats.data);
    }

    function clearAll() {
      textarea.value = '';
      errorDisplay.textContent = '';
      statsGrid.innerHTML = `<div class="stat-item"><span class="stat-label">no data</span><span class="stat-value empty">—</span></div>`;
      renderCharts([]);
    }

    // ---------- event binding ----------
    calculateBtn.addEventListener('click', processInput);
    clearBtn.addEventListener('click', clearAll);

    textarea.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        processInput();
      }
    });

    // initial load
    window.addEventListener('load', () => {
      processInput();
    });

  })();
</script>
</body>
</html>
